apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-worker
  # namespace 不写真（部署服务端强制覆写为目标环境命名空间）
  labels:
    app: example-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example-worker
  template:
    metadata:
      labels:
        app: example-worker
    spec:
      containers:
        - name: example-worker
          image: localhost:32000/gis-platform/system/business/example-system/example-worker:0.1.0
          env:
            # 时区一票否决项：必须显式声明
            - name: TZ
              value: Asia/Shanghai
            # 包内互调走 Service DNS，不经网关
            - name: EXAMPLE_SERVER_BASE
              value: http://example-server:8080
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
