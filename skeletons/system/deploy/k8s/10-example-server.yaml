# 文件作用：example-server k8s 工作负载样例（Deployment + Service，publish 打包为 k8s-bundle 一键安装）
# 作者：JasonLee <shuiyuntian@foxmail.com>
# 创建日期：2026-09-14
# 版本：1.1.0
# 修改记录：
#   - 1.1.0 (2026-11-03) 增加 DC PostgreSQL Secret 四键注入（Secret 名保留部署占位符）
#   - 1.0.0 (2026-09-14) 模板仓骨架初始版本
#   - 1.0.1 (2026-10-05) 镜像命名补 tier 段；域内衔接注释改包级共享 ConfigMap/Secret
#   - 1.0.2 (2026-10-06) 去内部命名空间字面量（namespace 由部署服务端覆写，注释占位）
#
# 版权所有 (C) 2026 AGRSEarth 项目
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-server
  # namespace 不写真（部署服务端强制覆写为目标环境命名空间）
  labels:
    app: example-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example-server
  template:
    metadata:
      labels:
        app: example-server
    spec:
      containers:
        - name: example-server
          # 镜像 tag = 组件版本轴（container/example-server/VERSION），publish 部署段自动 patch
          image: localhost:32000/gis-platform/system/business/example-system/example-server:0.1.0
          ports:
            - containerPort: 8080
          env:
            # 时区一票否决项：必须显式声明
            - name: TZ
              value: Asia/Shanghai
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: __DB_SECRET_NAME__
                  key: jdbc-url
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: __DB_SECRET_NAME__
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: __DB_SECRET_NAME__
                  key: password
            - name: DB_SCHEMA
              valueFrom:
                secretKeyRef:
                  name: __DB_SECRET_NAME__
                  key: schema
          # 包内衔接（复制后按需启用）：__DB_SECRET_NAME__ 由 DC deploy 自动收敛
          # 非密共享配置可整体引入包级共享 ConfigMap
          # envFrom:
          #   - configMapRef:
          #       name: example-system-shared
          readinessProbe:
            httpGet:
              path: /example-server/actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: example-server
  # namespace 不写真（部署服务端强制覆写为目标环境命名空间）
spec:
  selector:
    app: example-server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
