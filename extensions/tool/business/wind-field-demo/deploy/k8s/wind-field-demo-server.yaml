# 文件作用：wind-field-demo-server k8s 部署清单（publish 时打包为 k8s-bundle；测试底座手动 apply 亦用本文件）
# 作者：JasonLee <shuiyuntian@foxmail.com>
# 创建日期：2026-10-07
# 版本：1.0.0
# 修改记录：
#   - 1.0.0 (2026-10-07) 初始创建（ext-test 实测验证：ConfigMap env + Deployment + Service）
#
# 版权所有 (C) 2026 AGRSEarth 项目
#
# 约定：
#   - namespace 不写死（发布时由平台按部署环境注入；手动 apply 用 kubectl -n <ns>）
#   - TZ=Asia/Shanghai 为强制项（时区铁律）
#   - nacos 走集群内短名 nacos:8848（NodePort 18810 仅供集群外/本地开发）
apiVersion: v1
kind: ConfigMap
metadata:
  name: wind-field-demo-server-config
data:
  SERVER_PORT: "8080"
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: "nacos:8848"
  SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: "nacos:8848"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  TZ: "Asia/Shanghai"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wind-field-demo-server
  labels:
    app: wind-field-demo-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wind-field-demo-server
  template:
    metadata:
      labels:
        app: wind-field-demo-server
    spec:
      containers:
        - name: wind-field-demo-server
          image: localhost:32000/gis-platform/tool/business/wind-field-demo/wind-field-demo-server:0.1.1
          # 开发/测试期同 tag 迭代必须 Always，否则节点缓存旧镜像（IfNotPresent 陷阱）
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: wind-field-demo-server-config
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              # 必须 ≥ 镜像 JAVA_OPTS 的 -Xmx1024m + non-heap 余量，否则 OOMKilled(137)
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: wind-field-demo-server
  labels:
    app: wind-field-demo-server
spec:
  type: ClusterIP
  selector:
    app: wind-field-demo-server
  ports:
    - port: 8080
      targetPort: 8080
      name: http
