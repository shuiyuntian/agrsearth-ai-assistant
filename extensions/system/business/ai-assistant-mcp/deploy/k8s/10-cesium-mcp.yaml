apiVersion: v1
kind: ConfigMap
metadata:
  name: cesium-mcp-config
  labels:
    app: cesium-mcp
data:
  NODE_ENV: "production"
  NOMINATIM_SERVER_URL: "http://nominatim:8080"
  OSRM_SERVER_URL: "http://osrm:5000"
  OVERPASS_SERVER_URL: "http://overpass/api/interpreter"
  OSM_USER_AGENT: "AGRSEarth/1.0"
---
apiVersion: v1
kind: Service
metadata:
  name: cesium-mcp
  labels:
    app: cesium-mcp
spec:
  type: ClusterIP
  selector:
    app: cesium-mcp
  ports:
    - name: sse
      port: 3010
      targetPort: sse
    - name: mcp-http
      port: 4010
      targetPort: mcp-http
    - name: geolocation
      port: 3008
      targetPort: geolocation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cesium-mcp
  labels:
    app: cesium-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cesium-mcp
  template:
    metadata:
      labels:
        app: cesium-mcp
    spec:
      containers:
        - name: cesium-mcp
          image: localhost:32000/gis-platform/system/business/ai-assistant-mcp/cesium-mcp:2.1.4
          ports:
            - containerPort: 3010
              name: sse
            - containerPort: 4010
              name: mcp-http
            - containerPort: 3008
              name: geolocation
          envFrom:
            - configMapRef:
                name: cesium-mcp-config
          env:
            - name: TZ
              value: Asia/Shanghai
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /mcp/health
              port: sse
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /mcp/health
              port: sse
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
